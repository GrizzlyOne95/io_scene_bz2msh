name: Release BZ2 MSH Importer v1.2.0 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.2.0-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify versions
        run: |
          grep -F 'version = "1.2.0"' blender_manifest.toml
          grep -F '"version": (1, 2, 0)' __init__.py

      - name: Verify Python syntax
        run: python -m py_compile __init__.py bz2msh.py bz2pak.py msh_blender_importer.py softimage_pic.py

      - name: Build Blender Extension ZIP
        run: |
          zip io_scene_bz2msh-v1.2.0.zip __init__.py blender_manifest.toml bz2msh.py bz2pak.py msh_blender_importer.py softimage_pic.py
          test "$(stat -c%s io_scene_bz2msh-v1.2.0.zip)" -gt 10000
          unzip -l io_scene_bz2msh-v1.2.0.zip | grep -F 'blender_manifest.toml'
          unzip -l io_scene_bz2msh-v1.2.0.zip | grep -F '__init__.py'

      - name: Create v1.2.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          target_commitish: ${{ github.sha }}
          name: Release v1.2.0
          body_path: docs/RELEASE_NOTES_v1.2.0.md
          files: io_scene_bz2msh-v1.2.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
