name: Release BZ2 MSH Importer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BLENDER_VERSION: "4.5.14"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("blender_manifest.toml", "rb") as f:
              manifest = tomllib.load(f)

          version = manifest["version"]
          tag = f"v{version}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
          print(f"Manifest release target: {tag}")
          PY

      - name: Check whether version is already released
        id: existing
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already exists; no release needed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} is new; preparing release."
          fi

      - name: Verify release notes exist
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          test -f "docs/RELEASE_NOTES_v${{ steps.version.outputs.version }}.md"

      - name: Verify Python syntax
        if: steps.existing.outputs.exists != 'true'
        run: python -m py_compile __init__.py bcn.py bz2msh.py bz2pak.py msh_blender_importer.py softimage_pic.py

      - name: Download Blender LTS
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xJf "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Validate extension source
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: '"$BLENDER_BIN" --command extension validate'

      - name: Build Blender Extension
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          "$BLENDER_BIN" --command extension build             --output-filepath "$GITHUB_WORKSPACE/io_scene_bz2msh-${{ steps.version.outputs.tag }}.zip"

      - name: Validate built extension
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: '"$BLENDER_BIN" --command extension validate "$GITHUB_WORKSPACE/io_scene_bz2msh-${{ steps.version.outputs.tag }}.zip"'

      - name: Verify release package contents
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import zipfile

          tag = os.environ["RELEASE_TAG"]
          package = f"io_scene_bz2msh-{tag}.zip"
          expected = {
              "__init__.py",
              "blender_manifest.toml",
              "bcn.py",
              "bz2msh.py",
              "bz2pak.py",
              "msh_blender_importer.py",
              "softimage_pic.py",
          }

          with zipfile.ZipFile(package) as zf:
              names = {name.rstrip("/") for name in zf.namelist() if not name.endswith("/")}

          if names != expected:
              missing = sorted(expected - names)
              extra = sorted(names - expected)
              raise SystemExit(f"Unexpected package contents; missing={missing}, extra={extra}")

          print("Extension package contents verified")
          PY
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}

      - name: Create release tag
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create draft GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: docs/RELEASE_NOTES_v${{ steps.version.outputs.version }}.md
          files: io_scene_bz2msh-${{ steps.version.outputs.tag }}.zip
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
