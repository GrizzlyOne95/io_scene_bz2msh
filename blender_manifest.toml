schema_version = "1.0.0"

id = "io_scene_bz2msh"
version = "1.3.0"
name = "Battlezone II MSH Importer"
tagline = "Import Battlezone II MSH, PAK, animation, and texture data"
maintainer = "GrizzlyOne95"
type = "add-on"

website = "https://github.com/GrizzlyOne95/io_scene_bz2msh"

license = ["SPDX:MIT"]
blender_version_min = "4.5.0"

[permissions]
files = "Access local MSH/PAK files and decode or cache texture images"

[build]
paths = [
  "__init__.py",
  "bcn.py",
  "bz2msh.py",
  "bz2pak.py",
  "msh_blender_importer.py",
  "softimage_pic.py",
]
